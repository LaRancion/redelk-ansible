---
# 1. clone RedELK repo
# 2. prepare steps from init script
# 3. prepare stesp from elkserver setup
# 4. deploy using docker-compose
- name: Checkout RedELK git repo (localhost)
  ansible.builtin.git:
    repo: "https://github.com/{{ redelk_repo }}/RedELK.git"
    dest: "{{ redelk_repo_path }}"
    version: "{{ redelk_version }}"
  failed_when: false
  delegate_to: localhost

- name: Creating RedELK working directory
  become: true
  ansible.builtin.file:
    path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/{{ item }}"
    state: directory
    mode: 0755
  with_items:
    - certs
    - jupyter-workbooks
    - logstash-config
    - nginx-config
    - redelk-config/etc/cron.d
    - redelk-config/etc/redelk
    - redelk-logs
    - redelk-ssh
    - redelk-www
    - bloodhound-config

# jupyter
- name: Copying Jupyter workbooks from RedELK repository
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/jupyter-workbooks/{{ item | basename }}"
    mode: 0644
  with_fileglob:
    - "{{ redelk_repo_path }}/elkserver/mounts/jupyter-workbooks/*"

# logstash
# - name: Copying logstash config files from RedELK repository
#   become: true
#   copy:
#     src: "{{ item }}"
#     dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/logstash-config/{{ item | basename }}"
#   with_fileglob:
#     - "{{ redelk_repo_path }}/elkserver/docker/redelk-logstash/redelkinstalldata/redelk-main/conf.d/*"
- name: Copying logstash config files from RedELK repository
  become: true
  ansible.posix.synchronize:
    src: "{{ redelk_repo_path }}/elkserver/mounts/logstash-config/"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/logstash-config/"
    mode: push
    use_ssh_args: true
- name: Copying Logstash beats output config
  become: true
  ansible.builtin.copy:
    src: "98-outputs-beats_logstash.conf"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/logstash-config/redelk-main/conf.d/98-outputs-beats_logstash.conf"
    mode: 0644
  when: monitor_hosts

# nginx
- name: Copying nginx config file
  become: true
  ansible.builtin.template:
    src: nginx-config/default.conf.j2
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/nginx-config/default.conf.template"
    mode: 0644
  tags:
    - nginx
- name: Copying ssl-dhparams.pem config file from RedELK repository
  become: true
  ansible.builtin.copy:
    src: "{{ redelk_repo_path }}/elkserver/mounts/nginx-config/ssl-dhparams.pem.template"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/nginx-config/ssl-dhparams.pem.template"
    mode: 0640
  tags:
    - nginx
- name: Create Nginx htpasswd file for {{ es_redelk_user }}
  become: true
  community.general.htpasswd:
    path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/nginx-config/htpasswd.users.template"
    name: "{{ es_redelk_user }}"
    password: "{{ es_redelk_password }}"
    owner: 0
    group: 101
    mode: 0640
  tags:
    - nginx
- name: Create Nginx htpasswd file (elastic)
  become: true
  community.general.htpasswd:
    path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/nginx-config/htpasswd.users.template"
    name: elastic
    password: "{{ es_elastic_password }}"
    owner: 0
    group: 101
    mode: 0640
  tags:
    - nginx

# cron
- name: Copying RedELK cron file
  become: true
  ansible.builtin.template:
    src: redelk-config/etc/cron.d/redelk.j2
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/redelk-config/etc/cron.d/redelk"
    mode: 0644
  tags:
    - cron

# Bloodhound setup
- name: Copying bloodhound config file
  become: true
  ansible.builtin.template:
    src: bloodhound/bloodhound.config.json.j2
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/bloodhound-config/bloodhound.config.json"
    mode: 0644

# RedELK config files
- name: Copying RedELK config files
  become: true
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/mounts/redelk-config/etc/redelk/{{ item | basename | regex_replace('.j2', '') }}"
    mode: 0644
  with_fileglob:
    - ../templates/redelk-config/etc/redelk/*.j2

# Docker-compose
- name: Copying docker-compose from RedELK repository
  become: true
  ansible.builtin.copy:
    src: "{{ redelk_repo_path }}/elkserver/redelk-{{ redelk_install_type }}.yml"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/redelk-{{ redelk_install_type }}.yml"
    mode: 0644
  tags:
    - docker

- name: Remove bloodhound dependency on nginx container (temp fix)
  become: true
  replace:
    path: "{{ optsec_dir }}/{{ redelk_user }}/redelk-{{ redelk_install_type }}.yml"
    regexp: '^\s+- bloodhound$'
    replace: ''
  tags:
    - docker 

- name: Generating docker-compose .env file
  become: true
  ansible.builtin.template:
    src: docker-env.j2
    dest: "{{ optsec_dir }}/{{ redelk_user }}/.env"
    mode: 0640
  tags:
    - docker

# When monitor_hosts == true
- name: Update docker-compose to monitor hosts (mount pipelines.yml)
  ansible.builtin.replace:
    path: "{{ optsec_dir }}/{{ redelk_user }}/redelk-{{ redelk_install_type }}.yml"
    regexp: '\#- \.\/mounts\/logstash-config\/config\/pipelines\.yml\:\/usr\/share\/logstash\/config\/pipelines\.yml'
    replace: "- {{ optsec_dir }}/{{ redelk_user }}/mounts/logstash-config/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml"
  when: monitor_hosts
  tags:
    - docker

- name: Update docker-compose to monitor hosts (mount conf.d)
  ansible.builtin.replace:
    path: "{{ optsec_dir }}/{{ redelk_user }}/redelk-{{ redelk_install_type }}.yml"
    regexp: '\#- \.\/mounts\/logstash-config\/redelk-main\:\/usr\/share\/logstash\/redelk-main'
    replace: "- {{ optsec_dir }}/{{ redelk_user }}/mounts/logstash-config/redelk-main:/usr/share/logstash/redelk-main"
  when: monitor_hosts
  tags:
    - docker

# init-letsencrypt.sh
- name: Copying init-letsencrypt.sh 
  become: true
  ansible.builtin.copy:
    src: "files/init-letsencrypt.sh"
    dest: "{{ optsec_dir }}/{{ redelk_user }}/init-letsencrypt.sh"
    mode: 0755
    owner: "{{ redelk_user }}"
    group: root
  tags:
    - pki
    - docker

- name: Check if Let's Encrypt certificate already exists
  become: true
  ansible.builtin.stat:
    path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certbot/conf/live/{{ external_domain }}/privkey.pem"
  register: le_cert
  tags:
    - pki

- name: Bootstrap Let's Encrypt certificate (first run only)
  become: true
  ansible.builtin.command:
    cmd: "./init-letsencrypt.sh redelk-{{ redelk_install_type }}.yml {{ external_domain }}"
    chdir: "{{ optsec_dir }}/{{ redelk_user }}/"
  when:
    - le_enable | bool
    - external_domain != 'localhost'
    - not le_cert.stat.exists
  changed_when: true
  # LE can legitimately fail (firewall/DNS not ready yet, rate limits); the
  # self-signed fallback below guarantees nginx can still start, so don't
  # fail the whole play here. A warning is emitted after the re-check.
  failed_when: false
  register: le_bootstrap
  tags:
    - pki
    - docker

- name: Check if certificate exists after bootstrap
  become: true
  ansible.builtin.stat:
    path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certbot/conf/live/{{ external_domain }}/fullchain.pem"
  register: le_cert_after
  tags:
    - pki

- name: Warn if Let's Encrypt certificate could not be obtained
  ansible.builtin.debug:
    msg: >-
      Let's Encrypt bootstrap FAILED (rc={{ le_bootstrap.rc | default('skipped') }}).
      Check port 80 is reachable from the internet for {{ external_domain }} and
      that DNS resolves to this host ({{ le_bootstrap.stderr_lines | default([]) | select('search', 'Timeout|connection|failed') | list | first | default('see certbot output above') }}).
      A self-signed fallback certificate was generated; replace it later by
      deleting mounts/certbot/conf/live/ and re-running this playbook.
  when:
    - not le_cert_after.stat.exists or (le_bootstrap.rc is defined and le_bootstrap.rc != 0)
  tags:
    - pki

# Fallback: self-signed dummy certificate so nginx can always start,
# even if the Let's Encrypt bootstrap failed (e.g. DNS not ready, port 80 unreachable)
- name: Generate fallback self-signed certificate if Let's Encrypt failed
  become: true
  ansible.builtin.command:
    cmd: >
      docker-compose -f redelk-{{ redelk_install_type }}.yml run -T --rm --entrypoint
      "openssl req -x509 -nodes -newkey rsa:4096 -days 365
      -keyout '/etc/letsencrypt/live/{{ external_domain }}/privkey.pem'
      -out '/etc/letsencrypt/live/{{ external_domain }}/fullchain.pem'
      -subj '/CN={{ external_domain }}'" certbot
    chdir: "{{ optsec_dir }}/{{ redelk_user }}/"
  when: not le_cert_after.stat.exists
  changed_when: true
  tags:
    - pki

- name: Ensure RedELK certificates are generated with retries
  block:
    - name: Wait until RedELK certificates are generated
      ansible.builtin.wait_for:
        path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certs/redelk-logstash/redelk-logstash.pkcs8.key"
        state: present
        timeout: 180  
        sleep: 5  
      register: cert_check
      ignore_errors: true
      tags:
        - pki

    - name: Stop Docker containers
      become: true
      community.docker.docker_compose:
        project_src: "{{ optsec_dir }}/{{ redelk_user }}"
        files: "redelk-{{ redelk_install_type }}.yml"
        state: absent
      when: cert_check.failed
      tags:
        - pki
        - docker

    - name: Delete existing certificates folder if check failed
      ansible.builtin.file:
        path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certs/"
        state: absent
      when: cert_check.failed
      tags:
        - pki

    - name: Run `docker-compose up` again
      become: true
      community.docker.docker_compose:
        project_src: "{{ optsec_dir }}/{{ redelk_user }}"
        files: "redelk-{{ redelk_install_type }}.yml"
        build: false
      register: docker_restart
      when: cert_check.failed
      tags:
        - pki
        - docker

    - name: Retry waiting for RedELK certificates
      ansible.builtin.wait_for:
        path: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certs/redelk-logstash/redelk-logstash.pkcs8.key"
        state: present
      register: cert_check_retry
      when: cert_check.failed
      tags:
        - pki

  rescue:
    - name: Fail the play if certificates are still missing after retries
      ansible.builtin.fail:
        msg: "RedELK certificates could not be generated after 2 attempts."
      when: cert_check_retry.failed | default(false)
      tags:
        - pki
        - docker


- name: Ensure local certificates directory exists
  become: true
  ansible.builtin.file:
    path: "{{ redelk_cert_path }}"
    state: directory
    mode: 0750
    owner: root
    group: root
  delegate_to: localhost

- name: Fetch redelk certificates
  become: true
  ansible.posix.synchronize:
    src: "{{ optsec_dir }}/{{ redelk_user }}/mounts/certs/"
    dest: "{{ redelk_cert_path }}/"
    mode: pull
    use_ssh_args: true
  tags:
    - pki
